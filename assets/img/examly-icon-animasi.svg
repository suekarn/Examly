<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sp{transform-box:fill-box;transform-origin:center top;animation:gy .6s cubic-bezier(.2,.8,.2,1) .1s both}
.ar{transform-box:fill-box;transform-origin:left center;animation:gx .6s cubic-bezier(.2,.8,.2,1) both}
.a1{animation-delay:.3s}.a2{animation-delay:.45s}.a3{animation-delay:.6s}
@keyframes gy{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes gx{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.badge{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) .95s both}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.chk{stroke-dasharray:100;animation:dr .5s ease-out 1.45s both}
@keyframes dr{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:rg 2.8s ease-out 2.2s infinite}
@keyframes rg{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.shine{animation:sw 5s ease-in-out 2.4s infinite}
@keyframes sw{0%,55%{transform:translateX(0)}85%,100%{transform:translateX(1000px)}}
.gl{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(-160px);opacity:0}to{transform:translateY(0);opacity:1}}
.tg{animation:fd .8s ease-out 1.7s both}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34e0c4"/><stop offset=".55" stop-color="#1fa8d0"/><stop offset="1" stop-color="#1d5fd8"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="hl" cx=".25" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="512" height="512" rx="112"/></clipPath>
<filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2a5b" flood-opacity=".35"/></filter>
</defs>
<rect width="512" height="512" rx="112" fill="url(#g)"/>
<rect width="512" height="512" rx="112" fill="url(#hl)"/>
<g filter="url(#ds)" fill="#fff">
<rect class="sp" x="120" y="112" width="46" height="232" rx="23"/>
<rect class="ar a1" x="120" y="112" width="214" height="46" rx="23"/>
<rect class="ar a2" x="120" y="205" width="156" height="46" rx="23"/>
<rect class="ar a3" x="120" y="298" width="150" height="46" rx="23"/>
</g>
<g class="badge">
<circle class="ring" cx="378" cy="378" r="78" fill="none" stroke="#fbbf24" stroke-width="6"/>
<circle cx="378" cy="378" r="78" fill="url(#gold)" stroke="#1f8fcf" stroke-width="16"/>
<path class="chk" pathLength="100" d="M344 380 L368 404 L414 350" fill="none" stroke="#0f172a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g clip-path="url(#cp)"><g transform="rotate(20 256 256)"><rect class="shine" x="-400" y="-100" width="140" height="720" fill="url(#sh)"/></g></g></svg>