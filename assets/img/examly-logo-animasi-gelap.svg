<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" width="1240" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.sp{transform-box:fill-box;transform-origin:center top;animation:gy .6s cubic-bezier(.2,.8,.2,1) .1s both}
.ar{transform-box:fill-box;transform-origin:left center;animation:gx .6s cubic-bezier(.2,.8,.2,1) both}
.a1{animation-delay:.3s}.a2{animation-delay:.45s}.a3{animation-delay:.6s}
@keyframes gy{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes gx{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.badge{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1) .95s both}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.chk{stroke-dasharray:100;animation:dr .5s ease-out 1.45s both}
@keyframes dr{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:rg 2.8s ease-out 2.2s infinite}
@keyframes rg{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.shine{animation:sw 5s ease-in-out 2.4s infinite}
@keyframes sw{0%,55%{transform:translateX(0)}85%,100%{transform:translateX(1000px)}}
.gl{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(-160px);opacity:0}to{transform:translateY(0);opacity:1}}
.tg{animation:fd .8s ease-out 1.7s both}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g transform="translate(24 24) scale(0.6563)"><defs>
