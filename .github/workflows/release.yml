name: Auto Release Update

on:
  push:
    branches: [main]
    paths:
      - 'application/**'
      - 'assets/**'
      - 'system/**'
      - 'index.php'
      - '.htaccess'
      - 'api_live_score.php'
      - 'ambil_skor.php'
      - 'live_score.php'
      - 'live_skor_api.php'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan versi
        id: v
        run: echo "version=1.2.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Buat zip dan hash
        id: z
        run: |
          VER=${{ steps.v.outputs.version }}
          zip -r update-$VER.zip application assets system index.php .htaccess \
            api_live_score.php ambil_skor.php live_score.php live_skor_api.php \
            -x "application/config/database.php" "application/config/config.php" \
               "application/cache/*" "application/logs/*"
               "application/config/database.php" "application/config/config.php" \
               "application/config/version.php" "application/config/updater.php" \
               "application/updater_data/*" "application/cache/*" "application/logs/*"
          echo "sha=$(sha256sum update-$VER.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: update-${{ steps.v.outputs.version }}.zip

      - name: Update version.json
        env:
          VER: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.z.outputs.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          jq --arg v "$VER" \
             --arg d "$(date +%F)" \
             --arg u "https://github.com/${{ github.repository }}/releases/download/v$VER/update-$VER.zip" \
             --arg s "$SHA" \
             --arg n "$MSG" \
             '.version=$v | .released=$d | .url=$u | .sha256=$s | .notes=$n' \
             version.json > tmp.json && mv tmp.json version.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          git commit -m "Auto update version.json to $VER"
          git push
