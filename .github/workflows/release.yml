#!/bin/bash
# Pemakaian: ./push.sh "pesan commit"
# Rilis (tag + zip + version.json) dibuat otomatis oleh GitHub Actions.

set -e

MSG="${1:-update}"
BRANCH="main"

# Folder tempat file hasil edit berada. Kosongkan/hapus blok ini
# jika file sudah kamu edit langsung di dalam repo.
SRC="/c/Users/NAMA_KAMU/Downloads"
if [ -d "$SRC" ]; then
  [ -f "$SRC/updater.php" ]     && cp "$SRC/updater.php"     application/config/updater.php
  [ -f "$SRC/Updater.php" ]     && cp "$SRC/Updater.php"     application/controllers/Updater.php
  [ -f "$SRC/App_updater.php" ] && cp "$SRC/App_updater.php" application/libraries/App_updater.php
fi

echo ">> Sinkron dengan GitHub (version.json diubah otomatis oleh Actions)..."
git pull --rebase --autostash origin $BRANCH

git add application/config/updater.php \
        application/controllers/Updater.php \
        application/libraries/App_updater.php

if git diff --cached --quiet; then
  echo "Tidak ada perubahan untuk di-commit."
  exit 0
fi

git commit -m "$MSG"
git push origin $BRANCH

echo ">> Push berhasil. Cek rilis di: https://github.com/suekarn/Examly/actions"
